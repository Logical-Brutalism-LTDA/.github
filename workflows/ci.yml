name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-smoke:
    name: Python / Lint & Smoke Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup uv & Python
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies (frozen lockfile)
        run: uv sync --frozen

      - name: Lint with Ruff
        run: uvx ruff check .

      - name: FastAPI Boot & Route Smoke Test
        run: |
          uv run --frozen --with httpx python - <<'EOF'
          from fastapi.testclient import TestClient
          from main import app

          client = TestClient(app)
          routes = [
              "/",
              "/benchmarks",
              # Uncomment once SEO routes are merged:
              # "/robots.txt",
              # "/sitemap.xml",
              # "/llms.txt",
              # "/llms-full.txt",
          ]
          for path in routes:
              res = client.get(path, follow_redirects=True)
              assert res.status_code == 200, f"{path} returned {res.status_code}"
          print("Smoke test passed: app boot and core routes healthy.")
          EOF

      - name: Run Pytest (if tests exist)
        run: |
          if [ -d "tests" ]; then
            uv run --frozen pytest -q
          else
            echo "No tests/ directory yet, skipping pytest."
          fi

  docker-build:
    name: Docker Build Verification
    runs-on: ubuntu-latest
    needs: lint-and-smoke

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify production Dockerfile builds
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: logical-brutalism:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
